services:
  laravel.test:
    build:
      context: .
      dockerfile: vendor/laravel/sail/runtimes/8.5/Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: sail-8.5/app
    container_name: smartrecruit
    ports:
      - '${APP_PORT:-8000}:80'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      # Override the project .env (DB_HOST=127.0.0.1 is for local dev on 8097);
      # inside the compose network MySQL is reachable via the service name.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: smartrecruit
      DB_USERNAME: sail
      DB_PASSWORD: password
    volumes:
      - '.:/var/www/html'
      # The container's web workers run via supervisord, which replaces the
      # child env with only LARAVEL_SAIL=1 (sail runtime). Sail apps therefore
      # take their DB config from the .env file. The host .env uses
      # DB_HOST=127.0.0.1 for local dev on 8097, so overlay a container-specific
      # .env (DB_HOST=mysql) here. See docker/.env.container (gitignored).
      - './docker/.env.container:/var/www/html/.env'
    networks:
      - forge
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: smartrecruit-mysql
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smartrecruit
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - forge

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smartrecruit-phpmyadmin
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: sail
      PMA_PASSWORD: password
      PMA_ARBITRARY: 1
    depends_on:
      - mysql
    networks:
      - forge

networks:
  forge:
    driver: bridge

volumes:
  mysql_data:
