name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate key
        run: php artisan key:generate

      # Tests run against SQLite :memory: (phpunit.xml) — the .env.example
      # sqlite file just needs to exist for this sanity migration.
      - name: Prepare SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      # - name: Test PHPStan
      #   run: ./vendor/bin/phpstan analyse

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      # Run the Pest test suite (tests/Feature + tests/Unit, SQLite :memory:).
      - name: Test PHPUnit (Pest)
        run: php artisan test
