<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="SmartRecruit">
  <defs>
    <linearGradient id="lwPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f85"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g transform="translate(8,8)">
    <rect width="56" height="56" rx="14" fill="url(#lwPink)"/>
    <path d="M44 18 H28 a7 7 0 0 0 0 14 H38 a7 7 0 0 1 0 14 H20"
